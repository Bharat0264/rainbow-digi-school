<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#2B2118"/>
  <text x="8" y="33" font-family="Georgia, serif" font-weight="700" font-size="28" fill="#F6C945">R</text>
  <!-- Subtle thin rainbow gradient line under the R -->
  <line x1="8" y1="37" x2="40" y2="37" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="grad" x1="8" y1="37" x2="40" y2="37">
      <stop offset="0%" stop-color="#E8A87C" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#85CDCA" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#D6A2E8" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#F6C945" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8A87C" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
